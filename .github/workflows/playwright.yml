name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers and Deps
      run: npx playwright install --with-deps

    - name: Run Playwright Tests (Electron)
      # Electron requires a display even in headless mode on Linux (xvfb)
      # verify-build logic handles this usually, but xvfb-run is explicit
      run: |
        sudo apt-get install -y xvfb
        xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm test

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
